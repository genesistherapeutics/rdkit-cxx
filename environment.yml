name: rdkit-cxx
channels:
  - conda-forge
dependencies:
  - librdkit-dev 2024.09.6
  - libboost-devel
  # RDKit 2024.09's CMake package finds Eigen3, whose types its headers use,
  # and librdkit-dev does not depend on it; RDKit was built with Eigen 3.4.
  - eigen 3.4.*
  - cxx-compiler
  - cmake >=3.22
  - python 3.12.*
  - pytest
