# Install with `pre-commit install`. CI runs every hook on every file (the
# pre-commit job in .github/workflows/ci.yml), skipping no-commit-to-branch.

# Vendored third-party files stay exactly as their upstream ships them.
exclude: ^wrapper/third_party/

repos:
  # Every change goes through a branch and a pull request, so a commit on main
  # or an RDKit series' branch is a mistake. Listed first so it fails before
  # the slower hooks run.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: no-commit-to-branch
        args: [--branch, main, --pattern, 'rdkit-\d{4}\.\d{2}']
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/google/addlicense
    rev: v1.2.0
    hooks:
      - id: addlicense
        args: [-c, Steven Kearnes, -f, .license-header.txt]

  - repo: local
    hooks:
      # addlicense only checks that a header exists, so this catches the
      # one-line form of the header (CONVENTIONS.md L1).
      - id: license-header
        name: license headers put "All rights reserved." on its own line
        entry: 'Kearnes\.? All[ ]rights reserved'
        language: pygrep
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --all
        language: system
        types: [rust]
        pass_filenames: false
      # tests/manifest_paths.rs is generated from the manifest
      # (CONVENTIONS.md I1); this also fails on manifest problems.
      - id: manifest-paths
        name: inventory/check.py --write-paths
        entry: python3 inventory/check.py --strict --write-paths tests/manifest_paths.rs
        language: system
        files: ^inventory/(check\.py|manifest\.toml|(inventory|python)-.*\.json)$
        pass_filenames: false

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.2
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v23.1.3
    hooks:
      - id: clang-format
        types_or: [c, c++]
        # RDKit's own headers, kept as RDKit wrote them.
        exclude: ^wrapper/vendor/

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.24.0
    hooks:
      - id: markdownlint-cli2
