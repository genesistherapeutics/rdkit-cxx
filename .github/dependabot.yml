# Weekly updates, each waiting a week after its release, so a bad release can
# be yanked before it reaches a pull request. The conda environment is not
# here: its specs are loose, so CI installs the latest builds on every run,
# and a new RDKit series opens an issue instead (rdkit-series.yml).
version: 2
updates:
  # The workflows pin each action to a commit, with its version in a comment;
  # Dependabot moves both.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  # cxx-gen writes C++ for the cxx runtime of the same release, so the two are
  # pinned exactly and move together. Other requirements change only when a
  # release falls outside them (Dependabot's default for Cargo, which its
  # config can't name: it takes only auto and lockfile-only for Cargo);
  # Cargo.lock takes every update.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      cxx:
        patterns: ["cxx", "cxx-gen"]

  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      pre-commit:
        patterns: ["*"]

  # Each RDKit series' branch (README.md, Releases) gets the same updates as
  # main, in pull requests against it: Dependabot reads this file only from
  # main, so a branch's own copy configures nothing. A new series' branch
  # needs its three entries here when it is made.
  - package-ecosystem: github-actions
    directory: /
    target-branch: rdkit-2026.03
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: /
    target-branch: rdkit-2026.03
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      cxx:
        patterns: ["cxx", "cxx-gen"]

