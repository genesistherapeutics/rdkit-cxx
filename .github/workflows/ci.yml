name: CI

# Branches with a pull request run once, as pull_request; push covers main
# and this release branch, whose releases need CI's result on a push
# (README.md, Releases).
on:
  push:
    branches: [main, rdkit-2026.03]
  pull_request:

permissions:
  contents: read

# The Rust build starts from scratch every run, so incremental compilation
# would only cost time and disk. Colors keep Cargo's output readable in the log.
env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
    runs-on: ${{ matrix.os }}
    # ccache (below) compiles the C++ wrapper. It hashes the compiler by its
    # contents, since the environment's compiler is reinstalled every run,
    # and paths relative to the checkout.
    env:
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPILERCHECK: content
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Built from scratch every run, so nothing cached on a runner can make
      # the build pass.
      - uses: mamba-org/setup-micromamba@f457c30a868e4760d3a6fcea5f25dc655b8edf39 # v3.2.1
        with:
          environment-file: environment.yml
          init-shell: bash
          cache-environment: false
          cache-downloads: false
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy --no-self-update
          rustup default stable
      # The C++ wrapper's objects are cached by ccache, which reuses an
      # object only for the same compiler binary, flags, and preprocessed
      # source, so a cached object is the one the compiler would produce.
      - uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          key: ${{ github.job }}-${{ matrix.os }}
          max-size: 1G
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: The cookbook examples run
        run: |
          for example in examples/*.rs; do
            cargo run --quiet --example "$(basename "$example" .rs)" > /dev/null
          done
      - run: cmake -P tests/cmake/version_check.cmake
      - name: A downstream binary runs with no library path
        run: |
          # conda's Linux compilers add an rpath to $CONDA_PREFIX/lib on their
          # own, so link with the system's to check the documented line.
          cargo build -p downstream --config "target.'cfg(target_os = \"linux\")'.linker = '/usr/bin/cc'"
          env -u LD_LIBRARY_PATH -u DYLD_LIBRARY_PATH -u DYLD_FALLBACK_LIBRARY_PATH \
            ./target/debug/downstream | tee downstream.out
          grep "^RDKit 2026.03." downstream.out
      - name: Building outside an environment fails with one message
        run: |
          if env -u CONDA_PREFIX -u RDKIT_PREFIX cargo build > missing.out 2>&1; then
            echo "expected the build to fail"; exit 1
          fi
          cat missing.out
          grep -F "or set RDKIT_PREFIX" missing.out

  # Builds the crate from the files Cargo.toml's include list packages, as the
  # Release workflow does before it publishes.
  package:
    runs-on: ubuntu-24.04
    # ccache (below) compiles the C++ wrapper. It hashes the compiler by its
    # contents, since the environment's compiler is reinstalled every run,
    # and paths relative to the checkout.
    env:
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPILERCHECK: content
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: mamba-org/setup-micromamba@f457c30a868e4760d3a6fcea5f25dc655b8edf39 # v3.2.1
        with:
          environment-file: environment.yml
          init-shell: bash
          cache-environment: false
          cache-downloads: false
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
      - uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          key: ${{ github.job }}
          max-size: 1G
      - run: cargo package -p rdkit-cxx --locked

  # Valgrind's DRD sees RDKit's accesses to its globals even in conda's
  # uninstrumented build, so this fails when a wrapper tests/threads.rs runs
  # lacks a lock U4 needs.
  races:
    runs-on: ubuntu-24.04
    # ccache (below) compiles the C++ wrapper. It hashes the compiler by its
    # contents, since the environment's compiler is reinstalled every run,
    # and paths relative to the checkout.
    env:
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPILERCHECK: content
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: mamba-org/setup-micromamba@f457c30a868e4760d3a6fcea5f25dc655b8edf39 # v3.2.1
        with:
          environment-file: environment.yml
          create-args: valgrind
          init-shell: bash
          cache-environment: false
          cache-downloads: false
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
      - uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          key: ${{ github.job }}
          max-size: 1G
      - name: Threads do not race on RDKit's global state
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER: valgrind --tool=drd --suppressions=tests/drd.supp --log-file=target/drd.log
        run: |
          cargo test --test threads
          python3 tests/check_drd_log.py target/drd.log

  inventory:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: python3 -m pytest inventory
      - run: python3 inventory/check.py --strict --write-paths tests/manifest_paths.rs
      - name: The generated path test is up to date
        run: git diff --exit-code tests/manifest_paths.rs

  pre-commit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --no-self-update
          rustup default stable
      - run: pip install pre-commit
      # Runs every hook, addlicense among them, on every file. CI also runs on
      # main, where no-commit-to-branch would always fail.
      - run: SKIP=no-commit-to-branch pre-commit run --all-files --show-diff-on-failure

  docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
      - run: env -u CONDA_PREFIX -u RDKIT_PREFIX DOCS_RS=1 cargo doc --no-deps -p rdkit-cxx

  # The Rust compiles with the rust-version Cargo.toml declares. cxx sets its
  # own minimum, so a cxx update can raise it. Checking skips the C++, as the
  # docs job does: it compiles the same with any Rust.
  msrv:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        run: |
          msrv="$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "rdkit-cxx") | .rust_version')"
          rustup toolchain install "${msrv}" --profile minimal --no-self-update
          rustup default "${msrv}"
      - run: env -u CONDA_PREFIX -u RDKIT_PREFIX DOCS_RS=1 cargo check -p rdkit-cxx --all-targets --locked
