name: RDKit series

# Opens an issue, as Dependabot would a pull request, when conda-forge has
# librdkit-dev from an RDKit series newer than the one environment.yml pins.
# Moving to a new series is done by hand (README.md, Releases), so a pull
# request bumping the pin alone would fail. Patch releases in the pinned series
# need nothing: CI installs the latest one on every run.
on:
  schedule:
    - cron: "23 14 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    if: github.repository == 'skearnes/rdkit-cxx'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Open an issue for a new RDKit series
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ASSIGNEE: ${{ github.repository_owner }}
        run: |
          series="$(sed -n 's/^ *- librdkit-dev \([0-9]\{4\}\.[0-9]\{2\}\)\.\*$/\1/p' environment.yml)"
          if [ -z "${series}" ]; then
            echo "environment.yml pins no librdkit-dev series, such as 2026.09.*" >&2
            exit 1
          fi
          # Final releases only: a pre-release (2027.03.1b1) waits for its
          # release.
          latest="$(curl -sSf --retry 3 https://api.anaconda.org/package/conda-forge/librdkit-dev \
            | jq -r '.versions[] | select(test("^[0-9]{4}\\.[0-9]{2}\\.[0-9]+$"))' \
            | sort -V | tail -n 1)"
          if [ -z "${latest}" ]; then
            echo "conda-forge lists no librdkit-dev release" >&2
            exit 1
          fi
          # Series are YYYY.MM, so they compare as strings.
          new_series="${latest%.*}"
          if [[ ! "${new_series}" > "${series}" ]]; then
            echo "conda-forge's latest librdkit-dev, ${latest}, is no newer than RDKit ${series}"
            exit 0
          fi
          # A closed issue counts too, as a closed Dependabot pull request
          # ignores its version.
          title="RDKit ${new_series} is on conda-forge"
          titles="$(gh issue list --state all --limit 1000 --json title --jq '.[].title')"
          if grep -Fxq "${title}" <<< "${titles}"; then
            echo "an issue already tracks RDKit ${new_series}"
            exit 0
          fi
          tag="Release_${latest//./_}"
          year="${series%.*}"
          month="$((10#${series#*.}))"
          gh issue create --title "${title}" --assignee "${ASSIGNEE}" --body-file - <<EOF
          conda-forge has \`librdkit-dev\` ${latest} ([release notes](https://github.com/rdkit/rdkit/releases/tag/${tag})), and this crate supports RDKit ${series}. A crate version for the new series (README.md, Parity and Releases):

          - [ ] Pin \`librdkit-dev ${new_series}.*\` in \`environment.yml\`.
          - [ ] \`bump-my-version bump --new-version ${new_series%.*}.$((10#${new_series#*.})).0\`
          - [ ] Regenerate the inventory from \`${tag}\` as \`inventory/inventory-${new_series}.json\`.
          - [ ] Update what names RDKit ${series}: \`git grep -nE '${year}[._]0?${month}'\`
          EOF
