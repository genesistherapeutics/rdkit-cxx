name: RDKit series

# Opens an issue, as Dependabot would a pull request, when conda-forge has a
# librdkit-dev release newer than the one environment.yml pins: from a newer
# RDKit series, or a patch release of the pinned one. The build accepts only
# the releases wrapper/vendor holds headers for (wrapper/vendor/README.md),
# and moving to a new one is done by hand (README.md, Releases), so a pull
# request bumping the pin alone would fail.
on:
  schedule:
    - cron: "23 14 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    if: github.repository == 'skearnes/rdkit-cxx'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Open an issue for a new RDKit series
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ASSIGNEE: ${{ github.repository_owner }}
        run: |
          pinned="$(sed -n 's/^ *- librdkit-dev \([0-9]\{4\}\.[0-9]\{2\}\.[0-9]\{1,\}\)$/\1/p' environment.yml)"
          if [ -z "${pinned}" ]; then
            echo "environment.yml pins no librdkit-dev release, such as 2026.09.1" >&2
            exit 1
          fi
          series="${pinned%.*}"
          # Final releases only, oldest first: a pre-release (2027.03.1b1)
          # waits for its release.
          versions="$(curl -sSf --retry 3 https://api.anaconda.org/package/conda-forge/librdkit-dev \
            | jq -r '.versions[] | select(test("^[0-9]{4}\\.[0-9]{2}\\.[0-9]+$"))' \
            | sort -V)"
          if [ -z "${versions}" ]; then
            echo "conda-forge lists no librdkit-dev release" >&2
            exit 1
          fi
          latest="$(tail -n 1 <<< "${versions}")"
          latest_patch=""
          while read -r version; do
            if [[ "${version}" == "${series}".* ]]; then
              latest_patch="${version}"
            fi
          done <<< "${versions}"
          # A closed issue counts too, as a closed Dependabot pull request
          # ignores its version.
          titles="$(gh issue list --state all --limit 1000 --json title --jq '.[].title')"
          # Opens an issue titled $1, with the body on stdin, unless one has
          # that title.
          open_issue() {
            if grep -Fxq "$1" <<< "${titles}"; then
              echo "an issue already tracks ${1% is on conda-forge}"
              cat > /dev/null
            else
              gh issue create --title "$1" --assignee "${ASSIGNEE}" --body-file -
            fi
          }
          opened=""
          # A patch release of the pinned series, which the build refuses
          # until wrapper/vendor holds its headers. Checked on its own, as
          # RDKit can patch a series after the next one is out.
          if [ "${latest_patch}" != "${pinned}" ] \
            && [ "$(printf '%s\n%s\n' "${pinned}" "${latest_patch}" | sort -V | tail -n 1)" = "${latest_patch}" ]; then
            opened=1
            tag="Release_${latest_patch//./_}"
            open_issue "RDKit ${latest_patch} is on conda-forge" <<EOF
          conda-forge has \`librdkit-dev\` ${latest_patch} ([release notes](https://github.com/rdkit/rdkit/releases/tag/${tag})), and this crate supports RDKit ${pinned}. The build refuses releases that \`wrapper/vendor\` holds no headers for (\`wrapper/vendor/README.md\`). A patch release for it (README.md, Releases):

          - [ ] Copy the vendored headers from \`${tag}\` into \`wrapper/vendor/${latest_patch}/\`, and update the wrappers for any class that changed: \`git diff --no-index wrapper/vendor/${pinned} wrapper/vendor/${latest_patch}\`.
          - [ ] Check the release's new values in the enums the bindings mirror (\`rdkit_enum!\`), which the crate panics on.
          - [ ] Pin \`librdkit-dev ${latest_patch}\` in \`environment.yml\`, and add the release to \`wrapper/vendor/README.md\`.
          EOF
          fi
          # A newer series, which needs a crate version of its own. Series are
          # YYYY.MM, so they compare as strings.
          new_series="${latest%.*}"
          if [[ "${new_series}" > "${series}" ]]; then
            opened=1
            tag="Release_${latest//./_}"
            year="${series%.*}"
            month="$((10#${series#*.}))"
            open_issue "RDKit ${new_series} is on conda-forge" <<EOF
          conda-forge has \`librdkit-dev\` ${latest} ([release notes](https://github.com/rdkit/rdkit/releases/tag/${tag})), and this crate supports RDKit ${pinned}. A crate version for the new series (README.md, Parity and Releases):

          - [ ] Pin \`librdkit-dev ${latest}\` in \`environment.yml\`.
          - [ ] \`bump-my-version bump --new-version ${new_series%.*}.$((10#${new_series#*.})).0\`
          - [ ] Regenerate the inventory from \`${tag}\` as \`inventory/inventory-${new_series}.json\`.
          - [ ] Copy the vendored headers from \`${tag}\` into \`wrapper/vendor/${latest}/\` (\`wrapper/vendor/README.md\`), and remove the RDKit ${series} directories.
          - [ ] Before \`main\` moves, create \`rdkit-${series}\` from it, which keeps the series and its releases from then on, and add it to the Release workflow's branch choices (\`.github/workflows/release.yml\`).
          - [ ] Update what names RDKit ${series}: \`git grep -nE '${year}[._]0?${month}'\`
          EOF
          fi
          if [ -z "${opened}" ]; then
            echo "conda-forge's latest librdkit-dev releases are no newer than RDKit ${pinned}"
          fi
