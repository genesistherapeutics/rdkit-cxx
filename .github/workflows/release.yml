name: Release

# Run by hand from the Actions tab, from main, choosing the branch to release
# (README.md, Releases): main, or the branch of an earlier RDKit series. The
# workflow always runs main's copy of this file, so every branch is released
# the same way. crates.io's trusted publisher for rdkit-cxx names this file.
on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to release
        type: choice
        default: main
        options:
          - main
          - rdkit-2026.09
          - rdkit-2026.03
          - rdkit-2025.09
          - rdkit-2025.03
          - rdkit-2024.09
          - rdkit-2024.03

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  # Prints the section of CHANGELOG.md under the heading `## <version>`.
  NOTES_AWK: |
    $0 == heading { found = 1; next }
    found && /^## / { exit }
    found { print }

jobs:
  # Bumps the version, tests the release commit, and builds the packaged crate,
  # with read-only permissions: the bump commit reaches the publish job as a
  # patch, and nothing is pushed until crates.io has the crate.
  build:
    if: github.repository == 'skearnes/rdkit-cxx'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read  # gh run list, for CI's result on the release commit
    defaults:
      run:
        shell: bash -leo pipefail {0}
    env:
      BRANCH: ${{ inputs.branch }}
    outputs:
      base: ${{ steps.base.outputs.base }}
      version: ${{ steps.bump.outputs.version }}
      commit: ${{ steps.bump.outputs.commit }}
      patch: ${{ steps.bump.outputs.patch }}
    steps:
      # A branch's own copy of this file may be older than main's.
      - name: Run from main
        run: |
          if [ "${GITHUB_REF}" != refs/heads/main ]; then
            echo "Run this workflow from main, and choose the branch to release with its branch input." >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.branch }}
      # The branch's head when the build started, which the publish job
      # checks out, so a push during the build changes nothing it releases.
      - name: Record the release commit
        id: base
        run: echo "base=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"
      # This workflow tests only on Linux x86-64, so it releases a commit only
      # once the branch's CI (every platform, the race check, the inventory)
      # passed on it.
      - name: CI passed on the release commit
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ steps.base.outputs.base }}
        run: |
          state="$(gh run list --repo "${GITHUB_REPOSITORY}" --workflow ci.yml \
            --commit "${BASE}" --event push --limit 1 \
            --json status,conclusion --jq '.[] | "\(.status) \(.conclusion)"')"
          if [ "${state}" != "completed success" ]; then
            echo "CI on ${BASE} is ${state:-not run}, not completed success." >&2
            echo "Release a commit of ${BRANCH} whose CI passed." >&2
            exit 1
          fi
      # Built from scratch, as in CI, so nothing cached can make the build pass.
      - uses: mamba-org/setup-micromamba@f457c30a868e4760d3a6fcea5f25dc655b8edf39 # v3.2.1
        with:
          environment-file: environment.yml
          init-shell: bash
          cache-environment: false
          cache-downloads: false
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
      - name: Bump the version
        id: bump
        # Releases the version in Cargo.toml if no tag has it yet (the first
        # release of an RDKit series), and otherwise the next patch, whose
        # notes are CHANGELOG.md's Unreleased section. The major and minor
        # levels name the RDKit series, so they never bump here.
        run: |
          pipx install bump-my-version==1.5.1
          version="$(bump-my-version show current_version)"
          # A series' branch releases only its series: rdkit-2025.09 is 2025.9.x.
          if [[ "${BRANCH}" == rdkit-* ]]; then
            series="${BRANCH#rdkit-}"
            if [[ "${version}" != "${series%.*}.$((10#${series#*.}))."* ]]; then
              echo "${BRANCH} has version ${version}, which is not RDKit ${series}'s" >&2
              exit 1
            fi
          fi
          status=0
          git ls-remote --exit-code --tags origin "refs/tags/v${version}" > /dev/null || status=$?
          if [ "${status}" -eq 0 ]; then
            if [ "$(grep -cx '## Unreleased' CHANGELOG.md)" != 1 ]; then
              echo "CHANGELOG.md needs one '## Unreleased' section, the release's notes" >&2
              exit 1
            fi
            git config user.name github-actions
            git config user.email github-actions@github.com
            # Dated as its parent, so every run from one commit makes the same
            # bump commit, and a retry recognizes the crate it published.
            GIT_AUTHOR_DATE="$(git log -1 --format=%cI)"
            GIT_COMMITTER_DATE="${GIT_AUTHOR_DATE}"
            export GIT_AUTHOR_DATE GIT_COMMITTER_DATE
            bump-my-version bump patch --no-commit --no-tag
            previous="${version}"
            version="$(bump-my-version show current_version)"
            sed -i "s/^## Unreleased\$/## ${version}/" CHANGELOG.md
            git commit -qam "Bump version: ${previous} → ${version} [skip actions]"
            echo "patch=$(git format-patch -1 --stdout | base64 -w0)" >> "${GITHUB_OUTPUT}"
            # Another branch of the series may have released this version.
            tagged="$(git ls-remote --tags origin "refs/tags/v${version}^{}" | cut -f1)"
            if [ -n "${tagged}" ] && [ "${tagged}" != "$(git rev-parse HEAD)" ]; then
              echo "v${version} tags ${tagged}, which ${BRANCH} does not have; merge it first" >&2
              exit 1
            fi
          elif [ "${status}" -ne 2 ]; then
            exit "${status}"
          fi
          cargo_version="$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "rdkit-cxx") | .version')"
          if [ "${cargo_version}" != "${version}" ]; then
            echo "Cargo.toml has ${cargo_version}, but .bumpversion.toml has ${version}" >&2
            exit 1
          fi
          if [ -z "$(awk -v heading="## ${version}" "${NOTES_AWK}" CHANGELOG.md | tr -d '[:space:]')" ]; then
            echo "CHANGELOG.md has no notes for ${version}" >&2
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "commit=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"
      # Builds the crate from the files it packages. Fails while Cargo.toml
      # sets publish = false.
      - run: cargo publish -p rdkit-cxx --locked --dry-run
      # The bump commit skips CI, so test it here.
      - run: cargo test --workspace --locked

  # The only job that can mint a crates.io token (id-token) or push to the
  # branch (ACTIONS_PUSH), so it runs no third-party code: the token exchange
  # is curl, and cargo publish --no-verify runs no build scripts.
  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write  # gh release create
      id-token: write  # crates.io trusted publishing
    defaults:
      run:
        shell: bash
    # Each step after the bump skips what an earlier attempt finished, so
    # re-running the failed jobs of a release completes it.
    env:
      BRANCH: ${{ inputs.branch }}
      VERSION: ${{ needs.build.outputs.version }}
      COMMIT: ${{ needs.build.outputs.commit }}
      PATCH: ${{ needs.build.outputs.patch }}
      USER_AGENT: rdkit-cxx-release (https://github.com/skearnes/rdkit-cxx)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build.outputs.base }}
          token: ${{ secrets.ACTIONS_PUSH }}
      - name: Apply the version bump
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          if [ -n "${PATCH}" ]; then
            base64 -d <<< "${PATCH}" | git am --committer-date-is-author-date
          fi
          if [ "$(git rev-parse HEAD)" != "${COMMIT}" ]; then
            echo "made $(git rev-parse HEAD), but the build job tested ${COMMIT}" >&2
            exit 1
          fi
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
      - name: Check crates.io
        id: crates-io
        # A crate already there must be this commit's, uploaded by an earlier
        # attempt; its .cargo_vcs_info.json names the commit it was packaged
        # from.
        run: |
          status="$(curl -sS -o /dev/null -w '%{http_code}' -H "User-Agent: ${USER_AGENT}" \
            "https://crates.io/api/v1/crates/rdkit-cxx/${VERSION}")"
          case "${status}" in
            404)
              echo "published=false" >> "${GITHUB_OUTPUT}"
              ;;
            200)
              sha1="$(curl -sSfL -H "User-Agent: ${USER_AGENT}" \
                "https://static.crates.io/crates/rdkit-cxx/rdkit-cxx-${VERSION}.crate" \
                | tar -xzO "rdkit-cxx-${VERSION}/.cargo_vcs_info.json" | jq -r .git.sha1)"
              if [ "${sha1}" != "${COMMIT}" ]; then
                echo "crates.io has rdkit-cxx ${VERSION} from ${sha1}, not ${COMMIT}" >&2
                exit 1
              fi
              echo "published=true" >> "${GITHUB_OUTPUT}"
              ;;
            *)
              echo "crates.io answered ${status} for rdkit-cxx ${VERSION}" >&2
              exit 1
              ;;
          esac
      - name: Publish to crates.io
        if: steps.crates-io.outputs.published == 'false'
        # Trades the job's OIDC token for a crates.io token, as
        # rust-lang/crates-io-auth-action does, and revokes it on exit.
        env:
          TOKENS_URL: https://crates.io/api/v1/trusted_publishing/tokens
        run: |
          jwt="$(curl -sS --fail-with-body \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=crates.io" | jq -er .value)"
          echo "::add-mask::${jwt}"
          response="$(JWT="${jwt}" jq -n '{jwt: env.JWT}' | curl -sS -X POST "${TOKENS_URL}" \
            -H "Content-Type: application/json" -H "User-Agent: ${USER_AGENT}" --data @-)"
          if ! token="$(jq -er .token <<< "${response}")"; then
            echo "crates.io refused the token exchange: ${response}" >&2
            exit 1
          fi
          echo "::add-mask::${token}"
          # A failed revocation leaves the token to expire on its own, after
          # 30 minutes, so it warns rather than failing a published release.
          trap 'curl -sS --fail-with-body -X DELETE "${TOKENS_URL}" \
            -H "Authorization: Bearer ${token}" -H "User-Agent: ${USER_AGENT}" \
            || echo "::warning::could not revoke the crates.io token"' EXIT
          CARGO_REGISTRY_TOKEN="${token}" cargo publish -p rdkit-cxx --locked --no-verify
      - name: Push the tag and version bump
        # The branch may have moved on during the build. The tag marks the
        # published commit either way, and the bump, which changes only
        # version lines and the changelog's heading, is rebased onto the
        # branch when it has.
        run: |
          tagged="$(git ls-remote --tags origin "refs/tags/v${VERSION}^{}" | cut -f1)"
          if [ -z "${tagged}" ]; then
            git tag -a "v${VERSION}" -m "rdkit-cxx ${VERSION}"
            git push origin "v${VERSION}"
          elif [ "${tagged}" != "${COMMIT}" ]; then
            echo "v${VERSION} already tags ${tagged}, not ${COMMIT}" >&2
            exit 1
          fi
          if [ -n "${PATCH}" ] && ! git push origin "HEAD:refs/heads/${BRANCH}"; then
            git fetch origin "${BRANCH}"
            git rebase FETCH_HEAD
            git push origin "HEAD:refs/heads/${BRANCH}"
          fi
      # The notes are the version's section of CHANGELOG.md, with a link to
      # the changes since the series' previous release. Only the newest
      # version of all is marked the latest release: a patch to an earlier
      # series is not.
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "v${VERSION}" > /dev/null 2>&1; then
            awk -v heading="## ${VERSION}" "${NOTES_AWK}" CHANGELOG.md > notes.md
            tags="$(git ls-remote --tags --refs origin 'refs/tags/v*' \
              | sed 's#.*refs/tags/##' | sort -V)"
            previous="$(awk -v series="v${VERSION%.*}." -v version="v${VERSION}" '
              index($0, series) == 1 { if ($0 == version) { print prev; exit } prev = $0 }
            ' <<< "${tags}")"
            if [ -n "${previous}" ]; then
              printf '\n**Changes**: %s/%s/compare/%s...v%s\n' "${GITHUB_SERVER_URL}" \
                "${GITHUB_REPOSITORY}" "${previous}" "${VERSION}" >> notes.md
            fi
            latest=false
            if [ "$(tail -n 1 <<< "${tags}")" = "v${VERSION}" ]; then
              latest=true
            fi
            gh release create "v${VERSION}" --verify-tag --latest="${latest}" \
              --title "v${VERSION}" --notes-file notes.md
          fi
