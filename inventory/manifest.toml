[modules.reasons]
"rdkit.Chem.ChemUtils.BulkTester" = "a broken legacy script: TestMolecule calls Randomize.CheckCanonicalization, which RDKit removed, so it fails every molecule that sanitizes, and TestSupplier calls the supplier's Python 2 next method"
"rdkit.Chem.DSViewer" = "drives Discovery Studio Viewer through Windows COM"
"rdkit.Chem.Draw.IPythonConsole" = "installs Jupyter display hooks for molecules and reactions"
"rdkit.Chem.Draw.InteractiveRenderer" = "renders molecules in Jupyter with RDKit's JavaScript library"
"rdkit.Chem.Draw.MolDrawing" = "the legacy drawing code, which draws on sping canvases; rdMolDraw2D, which is bound, replaced it"
"rdkit.Chem.Features.ShowFeats" = "draws molecules' features as arrows and spheres in PyMOL, over its XML-RPC server"
"rdkit.Chem.Fingerprints.ClusterMols" = "deprecated in RDKit: importing rdkit.Chem.Fingerprints warns that the package is deprecated; for its clustering, use ml::cluster::murtagh::cluster_data_dists"
"rdkit.Chem.Fingerprints.DbFpSupplier" = "supplies fingerprints from rdkit.Dbase query results"
"rdkit.Chem.Fingerprints.FingerprintMols" = "deprecated in RDKit: importing rdkit.Chem.Fingerprints warns that the package is deprecated; for its fingerprints, use rdmolops::rdk_fingerprint_with_params or rd_fingerprint_generator"
"rdkit.Chem.Fingerprints.MolSimilarity" = "deprecated in RDKit: importing rdkit.Chem.Fingerprints warns that the package is deprecated; for its similarity screens, use data_structs::fingerprint_similarity, with data_structs::top_n_container::TopNContainer for the best hits"
"rdkit.Chem.Fingerprints.SimilarityScreener" = "deprecated in RDKit: importing rdkit.Chem.Fingerprints warns that the package is deprecated; for its screens, use data_structs::fingerprint_similarity, with data_structs::top_n_container::TopNContainer for the best hits"
"rdkit.Chem.MCS" = "a deprecated wrapper over the legacy MCS search written in Python (rdkit.Chem.fmcs); rdFMCS, which is bound, replaced it"
"rdkit.Chem.MolDb" = "builds and reads molecule databases through rdkit.Dbase"
"rdkit.Chem.PandasPatcher" = "patches pandas' HTML rendering for PandasTools"
"rdkit.Chem.PandasTools" = "adds molecules and their drawings to pandas DataFrames"
"rdkit.Chem.Pharm2D.LazyGenerator" = "unfinished: importing it raises NotImplementedError"
"rdkit.Chem.PropertyMol" = "deprecated: a Mol subclass that pickles its properties; Rust pickles them with set_default_pickle_properties(PropertyPickleOptions::MolProps)"
"rdkit.Chem.PyMol" = "drives a PyMOL server over XML-RPC"
"rdkit.Chem.Subshape.demoCombined" = "a demonstration script that reads files from RDKit's source tree"
"rdkit.Chem.Suppliers.DbMolSupplier" = "supplies molecules from rdkit.Dbase query results"
"rdkit.Chem.fmcs" = "the legacy MCS search written in Python, which rdFMCS (bound) replaced"
"rdkit.DataStructs.HierarchyVis" = "draws on sping canvases, and does not import (it imports sping as a top-level package)"
"rdkit.Dbase" = "database helpers over Python's DB-API connections; Rust programs use their own database crates"
"rdkit.ML.Cluster.ClusterVis" = "draws cluster trees on sping canvases"
"rdkit.ML.Data.FindQuantBounds" = "a command-line script that finds quantization bounds for the columns of a database table through rdkit.Dbase; rdkit_cxx::ml::data::quantize does the work"
"rdkit.ML.Descriptors.CompoundDescriptors" = "a calculator of descriptors of compositions whose atomic data it reads from an rdkit.Dbase database (chemutils.GetAtomicData), with compound descriptors that Parser evaluates as Python code"
"rdkit.ML.Descriptors.Parser" = "evaluates compound-descriptor formulas by rewriting them into Python source and running eval on it, so a formula is Python code; Rust has no Python evaluator to run it"
"rdkit.ML.MLUtils.VoteImg" = "draws vote images with PIL"
"rdkit.RDConfig" = "Python configuration: database defaults, the Python executable and test command, a molecule viewer, and exception classes for obsolete code; RDKit's data directories are in rdkit_cxx::rd_paths"
"rdkit.VLib" = "a framework for pipelines of Python supplier, filter, and output nodes; Rust iterators fill that role"
"rdkit.sping" = "a legacy drawing library (PDF, PostScript, SVG, PIL, Tk, Qt, and wx canvases) that predates rdMolDraw2D; Rust draws with rdMolDraw2D, which is bound"
"rdkit.utils.cactvs" = "runs the CACTVS toolkit's command-line program to draw images"
"rdkit.utils.chemdraw" = "drives ChemDraw through Windows COM"
"rdkit.utils.chemdraw_qax" = "drives ChemDraw through a Qt ActiveX control"
"rdkit.utils.spiral" = "draws spirals on sping canvases"

[[entry]]
python = "rdkit.Avalon.pyAvalonTools.CheckMolecule"
reason = "not bound: the Avalon toolkit (External/AvalonTools, about 34,000 lines of C with unlocked global state) parses the SMILES and mol blocks it is given, and those RDKit writes for a molecule, without validating them: malformed SMILES such as ClC(Cl)=C1=CC=CC..1 corrupt its heap and malformed mol blocks are read out of bounds (crashes in Python), and its structure checker (struchk.c and the code it calls) runs as InitializeCheckMol, which is not bound, configured it; this binding has not audited the toolkit for the input it trusts (U1)"

