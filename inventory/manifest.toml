[[entry]]
python = "rdkit.Chem.rdEHTTools.RunMol"
reason = "not bound: RDKit's EHTTools::runMol (External/YAeHMOP/EHTTools.cpp) fcloses its two temporary files and then, destroying their Tempfile holders, reads each closed FILE through fileno and fcloses it again whenever that descriptor number is open: a use after free on every call (valgrind reports the reads in Python), and a double free once another thread reuses the descriptor, which no check of the input can prevent (U1)"

